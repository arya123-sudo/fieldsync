name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fieldsync
        ports:
          - 8095:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fieldsync"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      VERSION: '4.0.4'
      SERVERPOD_PASSWORD_database: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'

      - name: Install dependencies
        run: flutter pub get

      - name: Install Serverpod CLI
        run: |
          dart install serverpod_cli@$VERSION
          echo "${XDG_STATE_HOME:-$HOME/.local/state}/Dart/install/bin" >> "$GITHUB_PATH"

      - name: Run Serverpod generator
        working-directory: fieldsync_server
        run: serverpod generate

      - name: Run tests
        working-directory: fieldsync_server
        run: dart test
